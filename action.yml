name: Amyla Security Scan
description: Scan your repository and optionally upload reports to Amyla, without manual target setup.
author: Amyla
branding:
  icon: shield
  color: blue
inputs:
  token:
    description: Team upload token. Empty means scan without uploading (also suitable for fork pull requests).
    required: false
    default: ''
  ingest-url:
    description: HTTPS Amyla GitHub Actions ingest endpoint.
    default: https://services.amyla.net/api/scanner/ingests/github-actions
  scan-target-id:
    description: Optional legacy target identifier. Normally targets are resolved automatically.
    default: ''
  scan-instance:
    description: Stable identifier for this action invocation; distinguish multiple uploads in one GitHub run.
    default: ''
  working-directory:
    description: Directory to scan, relative to the checked-out repository.
    default: '.'
  profile:
    description: 'Scanner defaults: auto, laravel, kirby, php, or general.'
    default: auto
  fail-on-findings:
    description: Fail after all scans and uploads when findings exist (Trivy HIGH/CRITICAL only).
    default: 'false'
  run-gitleaks:
    description: 'Run Gitleaks: auto, true, false.'
    default: auto
  run-semgrep:
    description: 'Run Semgrep: auto, true, false.'
    default: auto
  run-trivy:
    description: 'Run Trivy: auto, true, false.'
    default: auto
  run-composer-audit:
    description: 'Run Composer audit: auto detects root composer.lock, or true/false.'
    default: auto
  run-npm-audit:
    description: 'Run npm audit: auto detects root package-lock.json/npm-shrinkwrap.json, or true/false.'
    default: auto
  run-phpstan:
    description: 'Run the project-installed vendor/bin/phpstan: auto/false disables, true enables.'
    default: 'false'
  run-zap:
    description: 'Run ZAP against a deployed application: true/false; auto disables.'
    default: 'false'
  zap-scan-mode:
    description: 'baseline crawls briefly and scans passively; full crawls and actively attacks an authorized test target.'
    default: baseline
  zap-target-url:
    description: HTTP(S) application URL; no embedded credentials, query, or fragment. Requires Docker on the runner.
    default: ''
  zap-timeout:
    description: 'Internal scan deadline in seconds, 60-5400. Empty uses 600 for baseline or 3600 for full; leave extra job time for upload.'
    default: ''
  zap-auth-username:
    description: HTTP Basic username, supplied via a GitHub secret together with zap-auth-password.
    default: ''
  zap-auth-password:
    description: HTTP Basic password, supplied via a GitHub secret.
    default: ''
  zap-headers:
    description: JSON object of fixed request headers, supplied via a GitHub secret; e.g. Authorization with a Bearer token.
    default: ''
  zap-auth-profile:
    description: Non-secret scan identity for the authenticated role; change when its permissions or coverage change.
    default: default
  zap-exclude-urls:
    description: Newline-separated URL regexes excluded from crawling and scanning.
    default: ''
  zap-fail-on:
    description: 'inherit follows fail-on-findings (High); none only reports; high/medium fail at that risk threshold.'
    default: inherit
  gitleaks-config:
    description: Local configuration path. Auto uses .github/.gitleaks.toml, then .gitleaks.toml, then built-in rules.
    default: ''
  gitleaks-mode:
    description: 'directory scans the current checkout; git scans available Git history (use fetch-depth: 0).'
    default: directory
  semgrep-config:
    description: Comma/newline-separated local config paths or p/... registry rules. Replaces defaults; auto detects .semgrep.yml/.semgrep.yaml.
    default: ''
  semgrep-extra-configs:
    description: Comma/newline-separated configs added to selected/default Semgrep rules.
    default: ''
  semgrep-extra-excludes:
    description: Comma/newline-separated exclude patterns added to profile defaults.
    default: ''
  composer-audit-paths:
    description: Comma/newline-separated directories relative to working-directory; empty means root only.
    default: ''
  npm-audit-paths:
    description: Comma/newline-separated directories relative to working-directory; empty means root only.
    default: ''
  phpstan-config:
    description: Optional local PHPStan configuration path; otherwise PHPStan discovers the project configuration.
    default: ''
  trivy-extra-skip-dirs:
    description: Comma/newline-separated directory patterns added to profile defaults.
    default: ''
outputs:
  scan-batch-id:
    description: Amyla scan batch identifier, empty when no upload completed.
    value: ${{ steps.upload.outputs.scan-batch-id }}
  reports-path:
    description: Absolute temporary directory containing summary.json and available raw reports.
    value: ${{ steps.scan.outputs.reports-path }}
  upload-status:
    description: 'Upload outcome: completed, failed, or skipped.'
    value: ${{ steps.upload.outputs.upload-status }}
runs:
  using: composite
  steps:
    - name: Run independent scanners
      id: scan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SCAN_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        SCAN_PROFILE: ${{ inputs.profile }}
        SCAN_RUN_GITLEAKS: ${{ inputs.run-gitleaks }}
        SCAN_RUN_SEMGREP: ${{ inputs.run-semgrep }}
        SCAN_RUN_TRIVY: ${{ inputs.run-trivy }}
        SCAN_RUN_COMPOSER_AUDIT: ${{ inputs.run-composer-audit }}
        SCAN_RUN_NPM_AUDIT: ${{ inputs.run-npm-audit }}
        SCAN_RUN_PHPSTAN: ${{ inputs.run-phpstan }}
        SCAN_SCAN_INSTANCE: ${{ inputs.scan-instance }}
        SCAN_RUN_ZAP: ${{ inputs.run-zap }}
        SCAN_ZAP_SCAN_MODE: ${{ inputs.zap-scan-mode }}
        SCAN_ZAP_TARGET_URL: ${{ inputs.zap-target-url }}
        SCAN_ZAP_TIMEOUT: ${{ inputs.zap-timeout }}
        SCAN_ZAP_AUTH_USERNAME: ${{ inputs.zap-auth-username }}
        SCAN_ZAP_AUTH_PASSWORD: ${{ inputs.zap-auth-password }}
        SCAN_ZAP_HEADERS: ${{ inputs.zap-headers }}
        SCAN_ZAP_AUTH_PROFILE: ${{ inputs.zap-auth-profile }}
        SCAN_ZAP_EXCLUDE_URLS: ${{ inputs.zap-exclude-urls }}
        SCAN_ZAP_FAIL_ON: ${{ inputs.zap-fail-on }}
        SCAN_GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
        SCAN_GITLEAKS_MODE: ${{ inputs.gitleaks-mode }}
        SCAN_SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        SCAN_SEMGREP_EXTRA_CONFIGS: ${{ inputs.semgrep-extra-configs }}
        SCAN_SEMGREP_EXTRA_EXCLUDES: ${{ inputs.semgrep-extra-excludes }}
        SCAN_COMPOSER_AUDIT_PATHS: ${{ inputs.composer-audit-paths }}
        SCAN_NPM_AUDIT_PATHS: ${{ inputs.npm-audit-paths }}
        SCAN_PHPSTAN_CONFIG: ${{ inputs.phpstan-config }}
        SCAN_TRIVY_EXTRA_SKIP_DIRS: ${{ inputs.trivy-extra-skip-dirs }}
      run: python3 "$ACTION_PATH/scripts/security_scan.py" scan
    - name: Upload available reports
      id: upload
      if: ${{ !cancelled() }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SCAN_REPORTS_PATH: ${{ steps.scan.outputs.reports-path }}
        SCAN_TOKEN: ${{ inputs.token }}
        SCAN_INGEST_URL: ${{ inputs.ingest-url }}
        SCAN_TARGET_ID: ${{ inputs.scan-target-id }}
      run: python3 "$ACTION_PATH/scripts/security_scan.py" upload
    - name: Check final result
      if: ${{ !cancelled() }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SCAN_REPORTS_PATH: ${{ steps.scan.outputs.reports-path }}
        SCAN_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: python3 "$ACTION_PATH/scripts/security_scan.py" gate
